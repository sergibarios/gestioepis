<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestió EPI's - Comandes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css?v=4}">
</head>
<body>

<div th:replace="~{fragments/header :: navbar}"></div>
<div th:replace="~{fragments/toast :: toast}"></div>

<div class="container mt-4 mb-5">
    <div class="d-flex justify-content-between align-items-center mt-4 mb-4 toolbar-row">
        <h2 class="text-white m-0 toolbar-title">Comandes</h2>
        <button type="button" class="btn btn-add" data-bs-toggle="modal" data-bs-target="#addOrderModal">
            <span class="btn-icon">+</span> Afegir comanda
        </button>
    </div>

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4 filter-row">
        <div class="filter-pill-group">
            <a th:href="@{/purchase-orders(sort='desc', status=${selectedStatus})}"
               class="filter-pill-btn"
               th:classappend="${sort == 'desc'} ? ' active' : ''">Més recents</a>
            <a th:href="@{/purchase-orders(sort='asc', status=${selectedStatus})}"
               class="filter-pill-btn"
               th:classappend="${sort == 'asc'} ? ' active' : ''">Més antigues</a>
        </div>

        <div class="filter-pill-group">
            <a th:href="@{/purchase-orders(sort=${sort})}"
               class="filter-pill-btn"
               th:classappend="${selectedStatus == null or #strings.isEmpty(selectedStatus)} ? ' active' : ''">Totes</a>
            <a th:href="@{/purchase-orders(sort=${sort}, status='pending')}"
               class="filter-pill-btn"
               th:classappend="${selectedStatus == 'pending'} ? ' active' : ''">Pendents</a>
            <a th:href="@{/purchase-orders(sort=${sort}, status='received')}"
               class="filter-pill-btn"
               th:classappend="${selectedStatus == 'received'} ? ' active' : ''">Rebudes</a>
        </div>
    </div>

    <div class="card border-0 shadow-sm" style="background-color: #1e1e1e; border-radius: 8px; overflow: hidden;">
        <div class="table-responsive">
            <table class="table table-dark table-hover mb-0" style="background-color: #1e1e1e;">
                <thead>
                <tr>
                    <th class="py-3 px-4 border-bottom border-secondary">Data</th>
                    <th class="py-3 px-4 border-bottom border-secondary">Nom</th>
                    <th class="py-3 px-4 border-bottom border-secondary">Comentaris</th>
                    <th class="py-3 px-4 border-bottom border-secondary">Albarans</th>
                    <th class="py-3 px-4 border-bottom border-secondary text-end">Accions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="order : ${orders}" th:id="'order-' + ${order.id}">
                    <td class="py-3 px-4 align-middle" th:text="${order.orderDate}"></td>
                    <td class="py-3 px-4 align-middle fw-bold" th:text="${order.name}"></td>
                    <td class="py-3 px-4 align-middle" th:text="${order.comments}"></td>
                    <td class="py-3 px-4 align-middle">
                        <div th:if="${order.deliveryNotes != null and !order.deliveryNotes.isEmpty()}">
                            <div th:each="note : ${order.deliveryNotes}" class="mb-2 p-2 rounded" style="background-color: #2a2a2a; border: 1px solid #444;">
                                <div class="d-flex justify-content-between align-items-center">
                                    <a th:href="@{/purchases#note-{id}(id=${note.id})}" class="fw-bold text-decoration-none hover-line" style="color: #ffb300; font-size: 0.85rem;" th:text="${note.reference}"></a>
                                    <div class="d-flex gap-2">
                                        <a th:if="${note.filePath != null}" th:href="@{${note.filePath}}" target="_blank" class="btn btn-sm btn-outline-light btn-note-action">Obrir</a>
                                        <a th:if="${note.filePath != null}" th:href="@{${note.filePath}}" download class="btn btn-sm btn-outline-light btn-note-action">Baixar</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <button type="button" class="btn btn-sm mt-1 w-100 add-note-btn" th:data-order-id="${order.id}" data-bs-toggle="modal" data-bs-target="#addNoteModal">
                            <span class="btn-icon">+</span> Afegir albarà
                        </button>
                    </td>
                    <td class="py-3 px-4 align-middle">
                        <div class="d-flex justify-content-end align-items-center gap-2">
                            <a th:if="${order.filePath != null}" th:href="@{${order.filePath}}" target="_blank" class="btn btn-sm btn-outline-light">Obrir</a>
                            <a th:if="${order.filePath != null}" th:href="@{${order.filePath}}" download class="btn btn-sm btn-outline-light">Baixar</a>
                            <button type="button" class="btn btn-sm btn-outline-warning" data-bs-toggle="modal" th:data-bs-target="'#editOrderModal' + ${order.id}">Editar</button>
                            <form th:action="@{/purchase-orders/delete/{id}(id=${order.id})}" method="post" class="delete-form">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(orders)}">
                    <td colspan="5" class="text-center text-muted py-5">No s'han trobat comandes.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="addOrderModal" data-quick-action="add" tabindex="-1" aria-labelledby="addOrderModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="background-color: #1e1e1e; border: 1px solid #333;">
            <div class="modal-header border-bottom border-secondary">
                <h5 class="modal-title text-white" id="addOrderModalLabel">Nova comanda</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form th:action="@{/purchase-orders}" method="post" enctype="multipart/form-data">
                <div class="modal-body p-4">
                    <label for="name">Nom de la comanda / referència</label>
                    <input type="text" id="name" name="name" required>

                    <label for="orderDate">Data</label>
                    <input type="date" id="orderDate" name="orderDate" required>

                    <label for="comments">Comentaris</label>
                    <textarea id="comments" name="comments" rows="3"></textarea>

                    <label for="file">PDF de la comanda</label>
                    <input type="file" id="file" name="file" accept=".pdf,.png,.jpg,.jpeg">
                </div>
                <div class="modal-footer border-top border-secondary">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Cancel·lar</button>
                    <button type="submit" class="btn">Desar comanda</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="addNoteModal" tabindex="-1" aria-labelledby="addNoteModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="background-color: #1e1e1e; border: 1px solid #333;">
            <div class="modal-header border-bottom border-secondary">
                <h5 class="modal-title text-white" id="addNoteModalLabel">Afegir nou albarà</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form th:action="@{/delivery-notes}" method="post" enctype="multipart/form-data">
                <div class="modal-body p-4">
                    <input type="hidden" id="noteOrderId" name="orderId">

                    <label for="reference">Referència de l'albarà</label>
                    <input type="text" id="reference" name="reference" required>

                    <label for="noteFile">Fitxer de l'albarà</label>
                    <input type="file" id="noteFile" name="file" accept=".pdf,.png,.jpg,.jpeg">
                </div>
                <div class="modal-footer border-top border-secondary">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Cancel·lar</button>
                    <button type="submit" class="btn">Desar albarà</button>
                </div>
            </form>
        </div>
    </div>
</div>

<th:block th:each="order : ${orders}">
    <div class="modal fade" th:id="'editOrderModal' + ${order.id}" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="background-color: #1e1e1e; border: 1px solid #333;">
                <div class="modal-header border-bottom border-secondary">
                    <h5 class="modal-title text-white">Editar comanda</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form th:action="@{/purchase-orders/edit/{id}(id=${order.id})}" method="post" enctype="multipart/form-data">
                    <div class="modal-body p-4">
                        <label for="name">Nom de la comanda / referència</label>
                        <input type="text" name="name" th:value="${order.name}" required>

                        <label for="orderDate">Data</label>
                        <input type="date" name="orderDate" th:value="${order.orderDate}" required>

                        <label for="comments">Comentaris</label>
                        <textarea name="comments" rows="3" th:text="${order.comments}"></textarea>

                        <label for="file">Actualitzar PDF (opcional)</label>
                        <input type="file" name="file" accept=".pdf,.png,.jpg,.jpeg">

                        <div th:if="${order.filePath != null}" class="mt-3">
                            <span class="text-muted" style="font-size: 0.85rem;">Fitxer actual: </span>
                            <a th:href="@{${order.filePath}}" target="_blank" class="text-white text-decoration-none" style="font-size: 0.85rem;">Veure PDF actual</a>
                        </div>
                    </div>
                    <div class="modal-footer border-top border-secondary">
                        <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Cancel·lar</button>
                        <button type="submit" class="btn">Actualitzar comanda</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</th:block>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/search.js}"></script>
<script th:src="@{/js/buttons.js}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const addNoteButtons = document.querySelectorAll('.add-note-btn');
        const noteOrderIdInput = document.getElementById('noteOrderId');

        addNoteButtons.forEach(button => {
            button.addEventListener('click', function () {
                noteOrderIdInput.value = this.getAttribute('data-order-id');
            });
        });
    });
</script>
</body>
</html>
