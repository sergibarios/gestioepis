<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestió EPI's - Entregues</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css?v=4}">
</head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>
<div th:replace="~{fragments/toast :: toast}"></div>

<div class="container mt-4 mb-5">
    <div class="d-flex justify-content-between align-items-center mt-4 mb-4 toolbar-row">
        <h2 class="text-white m-0 toolbar-title">Entregues</h2>
        <div class="search-wrapper-inline">
            <div th:replace="~{fragments/search :: searchBar}"></div>
        </div>
        <button type="button" class="btn btn-add" data-bs-toggle="modal" data-bs-target="#addHandoverModal">
            <span class="btn-icon">+</span> Afegir entrega
        </button>
    </div>

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4 filter-row">
        <div class="filter-pill-group">
            <a th:href="@{/handovers(sort='desc', personId=${selectedPersonId})}"
               class="filter-pill-btn"
               th:classappend="${sort == 'desc'} ? ' active' : ''">Més recents</a>
            <a th:href="@{/handovers(sort='asc', personId=${selectedPersonId})}"
               class="filter-pill-btn"
               th:classappend="${sort == 'asc'} ? ' active' : ''">Més antics</a>
        </div>

        <form method="get" id="personFilterForm">
            <input type="hidden" name="sort" th:value="${sort}">
            <select id="personFilter" name="personId" class="filter-select" onchange="document.getElementById('personFilterForm').submit()">
                <option value="">Totes les persones</option>
                <option th:each="person : ${people}"
                        th:value="${person.id}"
                        th:text="${person.name}"
                        th:selected="${selectedPersonId != null and selectedPersonId == person.id}"></option>
            </select>
        </form>
    </div>

    <div class="card border-0 shadow-sm table-card">
        <div class="table-responsive">
            <table class="table table-dark table-hover mb-0">
                <thead>
                <tr>
                    <th class="py-3 px-4 border-bottom border-secondary">Data</th>
                    <th class="py-3 px-4 border-bottom border-secondary">Persona</th>
                    <th class="py-3 px-4 border-bottom border-secondary">EPIs entregats</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="handover : ${handovers}" th:id="'handover-' + ${handover.id}">
                    <td class="py-3 px-4 align-middle" th:text="${handover.handoverDate}"></td>
                    <td class="py-3 px-4 align-middle fw-bold" th:text="${handover.person.name}"></td>
                    <td class="py-3 px-4 align-middle">
                        <div th:if="${handover.handedItems != null and !handover.handedItems.isEmpty()}">
                            <div th:each="item : ${handover.handedItems}" class="handover-item-chip">
                                <span class="text-white" style="font-size: 0.85rem;"
                                      th:text="${item.code + ' - ' + (item.subcategory != null ? item.subcategory.name : '-') + ' (' + item.itemSize + ')'}"></span>
                            </div>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(handovers)}">
                    <td colspan="3" class="text-center text-muted py-5">No s'han trobat entregues.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="addHandoverModal" data-quick-action="add" tabindex="-1" aria-labelledby="addHandoverModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
        <div class="modal-content" style="background-color: #1e1e1e; border: 1px solid #333;">
            <div class="modal-header border-bottom border-secondary">
                <h5 class="modal-title text-white" id="addHandoverModalLabel">Nova entrega</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="handoverForm" th:action="@{/handovers}" method="post">
                <div class="modal-body p-4">

                    <div id="handoverStepSelect">
                        <label for="personSearchInput">Persona</label>
                        <div class="select-search">
                            <input type="text" id="personSearchInput" placeholder="Cerca una persona..." autocomplete="off">
                            <div id="personSearchResults" class="select-search-results d-none">
                                <div class="select-search-option"
                                     th:each="person : ${people}"
                                     th:text="${person.name}"
                                     th:data-id="${person.id}"
                                     th:data-name="${person.name}"></div>
                            </div>
                        </div>
                        <div id="personSelected" class="select-search-selected d-none"></div>
                        <input type="hidden" id="personId" name="personId">

                        <label for="handoverDate">Data</label>
                        <input type="date" id="handoverDate" name="handoverDate" required>

                        <label for="itemSearchInput">EPIs a entregar</label>
                        <input type="text" id="itemSearchInput" placeholder="Cerca per codi, subcategoria o mida..." autocomplete="off">
                        <div class="item-checklist-count"><span id="itemSelectedCount">0</span> EPIs seleccionats</div>
                        <div class="item-checklist" id="itemChecklist">
                            <div class="item-checklist-row"
                                 th:each="item : ${items}"
                                 th:data-search="${#strings.toLowerCase(item.code + ' ' + (item.subcategory != null ? item.subcategory.name : '') + ' ' + item.itemSize)}">
                                <input type="checkbox" name="itemIds" th:value="${item.id}" th:id="'item-' + ${item.id}">
                                <label th:for="'item-' + ${item.id}"
                                       th:text="${item.code + ' - ' + (item.subcategory != null ? item.subcategory.name : '-') + ' (' + item.itemSize + ')'}"></label>
                            </div>
                            <div class="item-checklist-row" th:if="${#lists.isEmpty(items)}">
                                <span class="text-muted">No hi ha EPIs disponibles.</span>
                            </div>
                        </div>
                    </div>

                    <div id="handoverStepSummary" class="handover-summary d-none">
                        <dl class="mb-0">
                            <dt>Persona</dt>
                            <dd id="summaryPerson"></dd>
                            <dt>Data</dt>
                            <dd id="summaryDate"></dd>
                            <dt>EPIs (<span id="summaryCount">0</span>)</dt>
                            <dd>
                                <ul class="handover-summary-items" id="summaryItemsList"></ul>
                            </dd>
                        </dl>
                    </div>

                </div>
                <div class="modal-footer border-top border-secondary">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Cancel·lar</button>
                    <button type="button" class="btn d-none" id="handoverBackBtn">Enrere</button>
                    <button type="button" class="btn" id="handoverReviewBtn">Revisar</button>
                    <button type="submit" class="btn d-none" id="handoverConfirmBtn">Confirmar entrega</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/search.js}"></script>
<script th:src="@{/js/buttons.js}"></script>
<script th:src="@{/js/handovers.js}"></script>
</body>
</html>
